<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSC Prep — Banco de Questões Inteligente</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">IFSC<span>Prep</span></h1>
            <p class="logo-sub">Exame de Classificação</p>
        </div>
        <ul class="nav-links">
            <li><a href="#/" class="nav-link active" data-route="home">
                <span class="nav-icon">🏠</span> Início
            </a></li>
            <li><a href="#/estudo" class="nav-link" data-route="study">
                <span class="nav-icon">📖</span> Estudo
            </a></li>
            <li><a href="#/simulado" class="nav-link" data-route="exam">
                <span class="nav-icon">📝</span> Simulado
            </a></li>
            <li><a href="#/desempenho" class="nav-link" data-route="analytics">
                <span class="nav-icon">📊</span> Desempenho
            </a></li>
            <li><a href="#/tendencias" class="nav-link" data-route="trends">
                <span class="nav-icon">📈</span> Tendências
            </a></li>
            <li><a href="#/guia" class="nav-link" data-route="guide">
                <span class="nav-icon">🎯</span> Guia
            </a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="btn btn-sm btn-outline" onclick="Storage.exportData()">Exportar Dados</button>
            <input type="file" id="import-file" accept=".json" style="display:none" onchange="Storage.importData(event)">
            <button class="btn btn-sm btn-outline" onclick="document.getElementById('import-file').click()">Importar</button>
        </div>
    </nav>

    <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>

    <main class="main-content" id="main-content">
        <!-- Content injected by router -->
    </main>

    <nav class="bottom-nav" id="bottom-nav">
        <a href="#/" class="bottom-link active" data-route="home">
            <span>🏠</span><small>Início</small>
        </a>
        <a href="#/estudo" class="bottom-link" data-route="study">
            <span>📖</span><small>Estudo</small>
        </a>
        <a href="#/simulado" class="bottom-link" data-route="exam">
            <span>📝</span><small>Simulado</small>
        </a>
        <a href="#/desempenho" class="bottom-link" data-route="analytics">
            <span>📊</span><small>Desempenho</small>
        </a>
        <a href="#/guia" class="bottom-link" data-route="guide">
            <span>🎯</span><small>Guia</small>
        </a>
    </nav>

    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script src="js/study.js"></script>
    <script src="js/exam.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/trends.js"></script>
    <script src="js/guide.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
